services:
  db:
    image: postgres:18-alpine
    container_name: yog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yog}
      POSTGRES_USER: ${POSTGRES_USER:-yog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yog} -d ${POSTGRES_DB:-yog}"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_wal_size=4GB

volumes:
  pgdata:
