[project]
name = "yog"
version = "0.2.0"
description = "PostgreSQL loader and ML data client for the yog market dataset"
readme = "README.md"
authors = [{ name = "IgnacyBerent", email = "2gb02ignac@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "typer>=0.28.0",
]

[project.scripts]
yog = "yog:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
files = ["src/yog"]
strict = true
disallow_any_explicit = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
